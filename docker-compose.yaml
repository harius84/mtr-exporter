services:
  mtr-exporter:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.7.0}
    image: mtr-exporter:${VERSION:-0.7.0}
    ports:
      - "${MTR_PORT:-8080}:8080"
    # mtr sends ICMP and needs a raw socket. The reported path starts in
    # the container network. On Linux, set network_mode: host and drop
    # the ports mapping to measure from the host network namespace.
    cap_add:
      - NET_RAW
    restart: unless-stopped
    volumes:
      - ./helpers/mtr-jobs.example:/etc/mtr-exporter/jobs:ro
    command:
      - "-bind"
      - ":8080"
      - "-jobs"
      - "/etc/mtr-exporter/jobs"
      - "-watch-jobs"
      - "@every 30s"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
