services:
  mtr-exporter:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-0.7.0}
    image: mtr-exporter:${VERSION:-0.7.0}
    # Share the host network so mtr measures the host path and the
    # exporter is available at 127.0.0.1:8080. ports: is ignored here.
    network_mode: host
    cap_add:
      - NET_RAW
    restart: unless-stopped
    volumes:
      - ./helpers/mtr-jobs.example:/etc/mtr-exporter/jobs:ro
    command:
      - "-bind"
      - "127.0.0.1:8080"
      - "-jobs"
      - "/etc/mtr-exporter/jobs"
      - "-watch-jobs"
      - "@every 30s"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
